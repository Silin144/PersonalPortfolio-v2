name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - "resume.tex"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Move PDF into public/
        run: |
          mkdir -p public
          mv resume.pdf public/resume.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/resume.pdf; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git add public/resume.pdf
          git commit -m "chore: rebuild resume.pdf from resume.tex"
          git push
